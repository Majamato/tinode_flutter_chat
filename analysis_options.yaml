include: package:very_good_analysis/analysis_options.yaml

formatter:
  trailing_commas: automate

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"

plugins:
  riverpod_lint: 3.1.4

linter:
  rules:
    # Many internal widgets are Dart-public (one widget per file). Everything
    # the barrel exports must still carry dartdoc: see docs/widgets.md.
    public_member_api_docs: false
    always_put_control_body_on_new_line: true
