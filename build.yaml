# Providers may only live in application layers (docs/riverpod.md), and
# drift tables only in the offline data layer.
targets:
  $default:
    builders:
      riverpod_generator:
        generate_for:
          - lib/src/**/application/*.dart
      drift_dev:
        generate_for:
          - lib/src/offline/data/chat_database.dart
          - lib/src/offline/data/chat_search.drift
        options:
          store_date_time_values_as_text: true
          sql:
            dialect: sqlite
            options:
              version: "3.45"
              modules: [fts5, json1]
