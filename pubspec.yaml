name: tinode_flutter_chat
description: Drop-in Flutter chat UI for the Tinode chat server, built on tinode_dart_client.
version: 0.1.0-dev.1
publish_to: none # Until tinode_dart_client is hosted on pub.dev.
topics:
  - tinode
  - chat
  - messaging
  - ui

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  camerawesome: ^2.5.0
  clock: ^1.1.1
  collection: ^1.19.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_callkit_incoming: ^3.1.6
  flutter_image_compress: ^2.5.1
  flutter_riverpod: 3.1.0
  flutter_webrtc: ^1.6.2
  gal: ^2.3.3
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  just_audio: ^0.10.6
  meta: ^1.16.0
  mime: ^2.1.0
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  phosphoricons_flutter: ^1.1.1
  record: ^6.2.1
  riverpod: 3.1.0
  riverpod_annotation: 4.0.0
  super_sliver_list: ^0.4.1
  tinode_dart_client:
    path: ../tinode_dart_client
  v_video_compressor: ^2.2.3
  video_player: ^2.11.1
  web_socket: ^1.0.1
  webrtc_interface: ^1.5.1

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.31.0
  fake_async: ^1.3.3
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  riverpod_generator: 4.0.0+1
  very_good_analysis: 10.1.0
  video_player_platform_interface: ^6.9.0
